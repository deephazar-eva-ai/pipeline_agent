[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-agent"
version = "0.1.0"
description = "Seat 07 (Pipeline / CRM) capstone agent for AgentSwitch, plus its own test harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
