[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-agent"
version = "0.1.0"
description = "Seat 07 (Pipeline / CRM) capstone agent for AgentSwitch, plus its own test harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# The harness itself stays stdlib-only. Only the `anthropic` model backend for
# --task loop needs a package, and it is imported lazily, so installing this
# extra is required only if you select that backend. The ollama backend is
# plain HTTP and needs nothing.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
